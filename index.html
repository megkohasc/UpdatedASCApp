<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASC Roof Calculator</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f2f7;
}

.container {
    max-width: 480px;
    margin: auto;
    padding-bottom: 80px;
}

.logo {
    display: block;
    margin: 20px auto 10px;
    width: 150px;
}

.title {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 10px;
}

/* iOS Card */
.card {
    background: white;
    border-radius: 14px;
    margin: 12px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* Segmented Control */
.segment {
    display: flex;
    background: #e5e5ea;
    border-radius: 8px;
    overflow: hidden;
}

.segment button {
    flex: 1;
    border: none;
    padding: 8px;
    background: transparent;
    font-weight: 500;
    cursor: pointer;
}

.segment button.active {
    background: white;
    border-radius: 6px;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-top: 6px;
    font-size: 16px;
}

/* Primary Button */
.primary-btn {
    width: calc(100% - 24px);
    margin: 12px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #007aff;
    color: white;
    font-weight: 600;
    font-size: 16px;
}

/* Result */
.result {
    white-space: pre-line;
    font-size: 15px;
}

/* Tabs */
.tabs {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    display: flex;
    background: #fff;
    border-top: 1px solid #ddd;
}

.tabs div {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
}

/* Contact Buttons */
.contact-btn {
    display: block;
    margin: 10px 12px;
    padding: 14px;
    border-radius: 10px;
    color: white;
    text-align: center;
    font-weight: 600;
}

.blue { background: rgba(0,122,255,0.9); }
.green { background: rgba(52,199,89,0.9); }
.orange { background: rgba(255,149,0,0.9); }
.yellow { background: rgba(255,204,0,0.9); }

.hidden { display: none; }

</style>
</head>

<body>

<div class="container">

<img src="assets/ASCLogo1.png" class="logo">
<div class="title">Roof Calculator</div>

<!-- CALCULATOR -->
<div id="calculator">

<div class="card">
    <label>Calculator Type</label>
    <div class="segment">
        <button onclick="setType('Coatings')" id="btnCoatings" class="active">Coatings</button>
        <button onclick="setType('Rolls')" id="btnRolls">Rolls</button>
    </div>
</div>

<div class="card">
    <label>Roof Size (squares)</label>
    <input type="number" id="roofSize">
</div>

<div class="card">
    <label>Warranty</label>
    <select id="warranty">
        <option>10 Year</option>
        <option>15 Year</option>
        <option>20 Year</option>
    </select>
</div>

<div class="card" id="coatingsCard">
    <label>Coating Type</label>
    <select id="coatingType">
        <option>ASC S Silicone</option>
        <option>ASC 1 Acrylic</option>
        <option>ASC X Acrylic</option>
    </select>
</div>

<div class="card hidden" id="rollsCard">
    <label>Roll System</label>
    <select id="rollSystem">
        <option>APP over SA</option>
        <option>SA over SA</option>
    </select>
</div>

<button class="primary-btn" onclick="calculate()">Calculate</button>

<div class="card result" id="result"></div>

</div>

<!-- PDF VIEW -->
<div id="pdf" class="hidden">

<div class="card">
    <label>System</label>
    <select id="system">
        <option>ASC S Silicone</option>
        <option>ASC 1 Acrylic</option>
        <option>ASC X Acrylic</option>
        <option>SBS SA</option>
        <option>APP</option>
    </select>
</div>

<div class="card">
    <label>Existing Material</label>
    <select id="existing">
        <option>ModBit</option>
        <option>Foam</option>
        <option>Metal</option>
        <option>EPDM</option>
        <option>TPO</option>
    </select>
</div>

<div class="card">
    <label>Warranty</label>
    <select id="pdfWarranty">
        <option>10 Year</option>
        <option>15 Year</option>
        <option>20 Year</option>
    </select>
</div>

<button class="primary-btn" onclick="openPDF()">View PDF</button>

</div>

<!-- CONTACT -->
<div id="contact" class="hidden">

<a class="contact-btn blue" href="https://maps.apple.com/?address=9631 De Soto Ave">Address</a>
<a class="contact-btn green" href="tel:5627778200">Call</a>
<a class="contact-btn orange" href="mailto:info@asc-bm.com">Email</a>
<a class="contact-btn yellow" href="https://www.asc-bm.com">Website</a>

</div>

</div>

<!-- TABS -->
<div class="tabs">
    <div onclick="showTab('calculator')">Calculator</div>
    <div onclick="showTab('pdf')">Spec PDFs</div>
    <div onclick="showTab('contact')">Contact</div>
</div>

<script>

let calcType = "Coatings";

function setType(type) {
    calcType = type;

    btnCoatings.classList.remove("active");
    btnRolls.classList.remove("active");

    if (type === "Coatings") {
        btnCoatings.classList.add("active");
        coatingsCard.classList.remove("hidden");
        rollsCard.classList.add("hidden");
    } else {
        btnRolls.classList.add("active");
        coatingsCard.classList.add("hidden");
        rollsCard.classList.remove("hidden");
    }
}

function calculate() {
    let size = parseFloat(roofSize.value);
    let warranty = warrantySelect = document.getElementById('warranty').value;

    if (!size) {
        result.innerText = "Please enter a valid roof size.";
        return;
    }

    if (calcType === "Coatings") {

        let coating = coatingType.value;
        let gps = 0;

        if (coating === "ASC S Silicone") {
            gps = warranty === "10 Year" ? 2 : warranty === "15 Year" ? 2.5 : 3;
        } else if (coating === "ASC 1 Acrylic") {
            gps = warranty === "10 Year" ? 3 : warranty === "15 Year" ? 6 : 7;
        } else {
            gps = warranty === "10 Year" ? 4 : warranty === "15 Year" ? 5 : 6;
        }

        let total = size * gps;

        result.innerText =
`Coatings Material Estimate

Roof Size: ${size.toFixed(1)} squares
Warranty: ${warranty}
Coating: ${coating}

• Total Coating Required:
  ${total.toFixed(1)} gallons`;

    } else {

        let system = rollSystem.value;
        let squares = Math.ceil(size);

        if (system === "SA over SA") {

            let base = warranty === "20 Year" ? squares * 0.6 :
                       warranty === "15 Year" ? squares * 0.5 : squares;

            result.innerText =
`SA over SA Material Estimate

Roof Size: ${squares} squares

• Base Rolls: ${Math.floor(base)}
• Cap Rolls: ${squares}

Based on ${warranty} system`;

        } else {

            let interply = warranty === "20 Year" ? squares * 0.6 :
                           warranty === "15 Year" ? squares * 0.5 : squares * 0.5;

            result.innerText =
`APP over SA Material Estimate

Roof Size: ${squares} squares

• Interply Rolls: ${Math.floor(interply)}
• Cap Rolls: ${squares}

Based on ${warranty} system`;
        }
    }
}

function openPDF() {
    let system = document.getElementById('system').value.replaceAll(" ", "_");
    let existing = document.getElementById('existing').value;
    let warranty = document.getElementById('pdfWarranty').value.replace(" Year","");

    let fileName;

    if (system === "SBS_SA" || system === "APP") {
        fileName = `${system}_${warranty}.pdf`;
    } else {
        fileName = `${existing}_${system}_${warranty}.pdf`;
    }

    window.open(`pdfs/${fileName}`, "_blank");
}

function showTab(tab) {
    calculator.classList.add("hidden");
    pdf.classList.add("hidden");
    contact.classList.add("hidden");

    document.getElementById(tab).classList.remove("hidden");
}

</script>

</body>
</html>
