<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roof Calculator</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        background: #f5f5f7;
    }

    .container {
        max-width: 500px;
        margin: auto;
        padding: 16px;
    }

    .logo {
        display: block;
        margin: 20px auto;
        width: 150px;
    }

    h1 {
        text-align: center;
    }

    .tabs {
        display: flex;
        justify-content: space-around;
        background: #fff;
        padding: 10px;
        border-top: 1px solid #ddd;
        position: fixed;
        bottom: 0;
        width: 100%;
        max-width: 500px;
    }

    .tab {
        cursor: pointer;
    }

    .section {
        background: #fff;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 10px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        margin-top: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    .blue { background: rgba(0,0,255,0.85); color: #fff; }
    .green { background: rgba(0,128,0,0.85); color: #fff; }
    .orange { background: rgba(255,165,0,0.85); color: #fff; }
    .yellow { background: rgba(255,215,0,0.85); color: #fff; }

    .hidden { display: none; }

</style>
</head>

<body>

<div class="container">

<img src="ASCLogo1.png" class="logo">

<h1>Roof Calculator</h1>

<!-- CALCULATOR -->
<div id="calculator">

<div class="section">
    <label>Calculator Type</label><br>
    <select id="calcType">
        <option>Coatings</option>
        <option>Rolls</option>
    </select>
</div>

<div class="section">
    <label>Roof Size (squares)</label>
    <input type="number" id="roofSize" style="width:100%;">
</div>

<div class="section">
    <label>Warranty</label><br>
    <select id="warranty">
        <option>10 Year</option>
        <option>15 Year</option>
        <option>20 Year</option>
    </select>
</div>

<div class="section" id="coatingsSection">
    <label>Coating Type</label><br>
    <select id="coatingType">
        <option>ASC S Silicone</option>
        <option>ASC 1 Acrylic</option>
        <option>ASC X Acrylic</option>
    </select>
</div>

<div class="section hidden" id="rollsSection">
    <label>Roll System</label><br>
    <select id="rollSystem">
        <option>APP over SA</option>
        <option>SA over SA</option>
    </select>
</div>

<button onclick="calculate()">Calculate</button>

<div class="section" id="result"></div>

</div>

<!-- PDF -->
<div id="pdf" class="hidden">
    <div class="section">
        <label>System</label>
        <select id="system">
            <option>ASC S Silicone</option>
            <option>ASC 1 Acrylic</option>
            <option>ASC X Acrylic</option>
            <option>SBS SA</option>
            <option>APP</option>
        </select>
    </div>

    <div class="section">
        <label>Warranty</label>
        <select id="pdfWarranty">
            <option>10 Year</option>
            <option>15 Year</option>
            <option>20 Year</option>
        </select>
    </div>

    <button onclick="openPDF()">View PDF</button>
</div>

<!-- CONTACT -->
<div id="contact" class="hidden">

<button class="blue" onclick="window.open('https://maps.apple.com/?address=9631 De Soto Ave')">
📍 Address
</button>

<button class="green" onclick="window.location='tel:5627778200'">
📞 Call
</button>

<button class="orange" onclick="window.location='mailto:info@asc-bm.com'">
✉️ Email
</button>

<button class="yellow" onclick="window.open('https://www.asc-bm.com')">
🌐 Website
</button>

</div>

</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab" onclick="showTab('calculator')">Calculator</div>
    <div class="tab" onclick="showTab('pdf')">Spec PDFs</div>
    <div class="tab" onclick="showTab('contact')">Contact</div>
</div>

<script>

function showTab(tab) {
    document.getElementById('calculator').classList.add('hidden');
    document.getElementById('pdf').classList.add('hidden');
    document.getElementById('contact').classList.add('hidden');

    document.getElementById(tab).classList.remove('hidden');
}

// Toggle sections
document.getElementById('calcType').addEventListener('change', function() {
    if (this.value === "Coatings") {
        coatingsSection.classList.remove('hidden');
        rollsSection.classList.add('hidden');
    } else {
        coatingsSection.classList.add('hidden');
        rollsSection.classList.remove('hidden');
    }
});

// CALCULATION (1:1 logic from Swift)
function calculate() {

    let size = parseFloat(document.getElementById('roofSize').value);
    let warranty = document.getElementById('warranty').value;
    let type = document.getElementById('calcType').value;

    if (!size) {
        result.innerText = "Please enter a valid roof size.";
        return;
    }

    if (type === "Coatings") {

        let coating = document.getElementById('coatingType').value;
        let gps = 0;

        if (coating === "ASC S Silicone") {
            gps = warranty === "10 Year" ? 2 : warranty === "15 Year" ? 2.5 : 3;
        } else if (coating === "ASC 1 Acrylic") {
            gps = warranty === "10 Year" ? 3 : warranty === "15 Year" ? 6 : 7;
        } else {
            gps = warranty === "10 Year" ? 4 : warranty === "15 Year" ? 5 : 6;
        }

        let total = size * gps;

        result.innerText = `Total Coating Required: ${total.toFixed(1)} gallons`;

    } else {

        let system = document.getElementById('rollSystem').value;
        let squares = Math.ceil(size);

        if (system === "SA over SA") {

            let base = warranty === "20 Year" ? squares * 0.6 :
                       warranty === "15 Year" ? squares * 0.5 : squares;

            result.innerText = `Base Rolls: ${Math.floor(base)} | Cap Rolls: ${squares}`;

        } else {

            let interply = warranty === "20 Year" ? squares * 0.6 :
                           warranty === "15 Year" ? squares * 0.5 : squares * 0.5;

            result.innerText = `Interply: ${Math.floor(interply)} | Cap Rolls: ${squares}`;
        }
    }
}

function openPDF() {
    alert("Hook this up to your hosted PDFs (same naming logic as app).");
}

</script>

</body>
</html>
